<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تطبيقات أ.د. على قطب — Prof Ali Kotb Apps</title>
<meta name="description" content="One place to open all of Prof Ali Kotb's apps.">
<meta name="theme-color" content="#163a5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Apps">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("hub-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style>
:root{--bg:#f4f2ec;--card:#ffffff;--ink:#14202e;--soft:#4a5668;--mute:#8590a0;--line:#e3ded3;--accent:#1f4e79;--tint:#e8eff6;--ok:#2e9e5b;--shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.06);color-scheme:light}
:root[data-theme="dark"]{--bg:#0f141b;--card:#18202b;--ink:#e7ebf1;--soft:#b5bfcd;--mute:#7f8a9b;--line:#2b3544;--accent:#7aa7d6;--tint:#1f2e42;--ok:#55c486;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[lang="en"] body{font-family:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;flex:none}
.title{flex:1;min-width:180px}
.title h1{font-size:20px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em}
.title p{margin:2px 0 0;font-size:12.5px;color:var(--mute)}
.tools{display:flex;gap:6px}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover{border-color:var(--accent)}
.ib.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
#install{display:none}
.search{margin:16px 0 4px;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 42px;font:inherit;font-size:15px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search svg{position:absolute;top:12px;inset-inline-start:14px;color:var(--mute)}
.search kbd{position:absolute;top:11px;inset-inline-end:12px;font:600 11px/20px Inter,sans-serif;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px}
section{margin-top:20px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:700}
[lang="ar"] h2{letter-spacing:0;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:inherit;text-decoration:none;transition:transform .12s ease,border-color .12s ease;min-height:112px}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.tile:active{transform:scale(.98)}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.name{font-size:14px;font-weight:600;line-height:1.25}
.host{font:500 10.5px/1.3 Inter,sans-serif;color:var(--mute);direction:ltr;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 22px);margin-top:-6px}
.dot{position:absolute;top:12px;inset-inline-end:12px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.up{background:var(--ok)}.dot.down{background:#d0645c}
.star{position:absolute;bottom:8px;inset-inline-end:8px;border:0;background:none;font-size:16px;cursor:pointer;color:var(--mute);padding:4px;line-height:1;opacity:0;transition:opacity .15s}
.tile:hover .star,.star.fav,.editing .star{opacity:1}
.star.fav{color:#e0a526}
.del{display:none;position:absolute;top:6px;inset-inline-start:6px;width:22px;height:22px;border-radius:50%;border:0;background:#c0392b;color:#fff;font-size:13px;cursor:pointer}
.editing .del{display:block}
.editing .tile:not(.add){animation:wob .35s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-.6deg)}to{transform:rotate(.6deg)}}
.add{border-style:dashed;align-items:center;justify-content:center;color:var(--mute);cursor:pointer;font:inherit;font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:20px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 12px;font-size:17px}
dialog label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:10px 0 4px}
dialog input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
footer{margin-top:28px;font-size:11.5px;color:var(--mute);text-align:center}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.tile{min-height:104px;padding:11px}.title h1{font-size:18px}.search kbd{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="/icons/icon.svg" alt="">
    <div class="title">
      <h1 data-ar="تطبيقات أ.د. على قطب" data-en="Prof Ali Kotb — Apps">تطبيقات أ.د. على قطب</h1>
      <p data-ar="كل التطبيقات في مكان واحد" data-en="All apps in one place">كل التطبيقات في مكان واحد</p>
    </div>
    <div class="tools">
      <button class="ib" id="install" title="Install">⤓ <span data-ar="تثبيت" data-en="Install">تثبيت</span></button>
      <button class="ib" id="edit" title="Edit"><span data-ar="تعديل" data-en="Edit">تعديل</span></button>
      <button class="ib" id="lang" title="Language">EN</button>
      <button class="ib" id="theme" title="Theme" aria-label="Theme">☾</button>
    </div>
  </header>

  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" data-ph-ar="ابحث عن تطبيق…" data-ph-en="Search apps…" placeholder="ابحث عن تطبيق…">
    <kbd>/</kbd>
  </div>

  <main id="main"></main>
  <footer data-ar="النقطة الخضراء = الموقع يستجيب الآن · ★ لإضافة التطبيق إلى المفضلة" data-en="Green dot = site responding now · ★ adds an app to Favourites">النقطة الخضراء = الموقع يستجيب الآن · ★ لإضافة التطبيق إلى المفضلة</footer>
</div>

<dialog id="dlg">
  <form method="dialog" id="addForm">
    <h3 data-ar="إضافة اختصار" data-en="Add shortcut">إضافة اختصار</h3>
    <label data-ar="الاسم" data-en="Name">الاسم</label>
    <input id="fName" required maxlength="40">
    <label data-ar="الرابط" data-en="Link">الرابط</label>
    <input id="fUrl" required type="text" inputmode="url" dir="ltr" placeholder="https://…">
    <label data-ar="رمز (إيموجي)" data-en="Icon (emoji)">رمز (إيموجي)</label>
    <input id="fIcon" maxlength="4" placeholder="⭐">
    <p class="hint" data-ar="يُحفظ على هذا الجهاز فقط." data-en="Saved on this device only.">يُحفظ على هذا الجهاز فقط.</p>
    <div class="row">
      <button class="ib" value="cancel" formnovalidate data-ar="إلغاء" data-en="Cancel">إلغاء</button>
      <button class="ib on" value="ok" data-ar="إضافة" data-en="Add">إضافة</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>

<script src="/apps.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let lang = store.get("hub-lang", "ar");
  let favs = store.get("hub-favs", ["queue", "neuroscholar", "prayer", "quran"]);
  let hidden = store.get("hub-hidden", []);
  let mine = store.get("hub-mine", []);
  let editing = false;
  const status = {};

  const all = () => [...APPS, ...mine.map((m) => ({ ...m, group: "mine" }))];
  const label = (a) => (lang === "ar" ? a.ar || a.en : a.en || a.ar);
  const host = (u) => { try { const x = new URL(u); return x.host.replace(/\.vercel\.app$/, "") + (x.pathname !== "/" ? x.pathname : ""); } catch { return u; } };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function tile(a) {
    const fav = favs.includes(a.id);
    return `<a class="tile" href="${esc(a.url)}" target="_blank" rel="noopener" style="--c:${a.color || "#1f4e79"}" data-id="${a.id}">
      <span class="dot ${status[a.url] || ""}" title="${status[a.url] === "up" ? "online" : status[a.url] === "down" ? "not responding" : ""}"></span>
      <button class="del" data-del="${a.id}" aria-label="remove">×</button>
      <span class="ico">${esc(a.icon || "⭐")}</span>
      <span class="name">${esc(label(a))}</span>
      <span class="host">${esc(host(a.url))}</span>
      <button class="star ${fav ? "fav" : ""}" data-fav="${a.id}" aria-label="favourite">${fav ? "★" : "☆"}</button>
    </a>`;
  }

  function render() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-ar]").forEach((el) => (el.textContent = el.dataset[lang]));
    const q = $("#q");
    q.placeholder = q.dataset[lang === "ar" ? "phAr" : "phEn"];
    $("#lang").textContent = lang === "ar" ? "EN" : "ع";
    $("#edit").classList.toggle("on", editing);
    const term = q.value.trim().toLowerCase();
    const list = all().filter((a) => !hidden.includes(a.id) && (!term || `${a.en} ${a.ar} ${a.url}`.toLowerCase().includes(term)));
    let html = "";
    const favList = favs.map((id) => list.find((a) => a.id === id)).filter(Boolean);
    if (favList.length && !term) html += `<section><h2>${lang === "ar" ? "المفضلة" : "Favourites"}</h2><div class="grid">${favList.map(tile).join("")}</div></section>`;
    for (const g of GROUPS) {
      const items = list.filter((a) => a.group === g.id);
      if (!items.length && !(g.id === "mine" && !term)) continue;
      html += `<section><h2>${lang === "ar" ? g.ar : g.en}</h2><div class="grid">${items.map(tile).join("")}${g.id === "mine" ? `<button class="tile add" id="addBtn">＋ ${lang === "ar" ? "إضافة اختصار" : "Add shortcut"}</button>` : ""}</div></section>`;
    }
    if (!list.length) html += `<p class="empty">${lang === "ar" ? "لا توجد نتائج." : "No matching apps."}</p>`;
    if (hidden.length && editing) html += `<p class="hint"><button class="ib" id="restore">${lang === "ar" ? `إظهار ${hidden.length} مخفي` : `Show ${hidden.length} hidden`}</button></p>`;
    const main = $("#main");
    main.innerHTML = html;
    main.classList.toggle("editing", editing);
  }

  function toast(t) {
    const el = $("#toast");
    el.textContent = t;
    el.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  // Clicks: favourite / remove / open
  $("#main").addEventListener("click", (e) => {
    const f = e.target.closest("[data-fav]");
    const d = e.target.closest("[data-del]");
    if (f) {
      e.preventDefault();
      const id = f.dataset.fav;
      favs = favs.includes(id) ? favs.filter((x) => x !== id) : [...favs, id];
      store.set("hub-favs", favs);
      return render();
    }
    if (d) {
      e.preventDefault();
      const id = d.dataset.del;
      if (mine.some((m) => m.id === id)) { mine = mine.filter((m) => m.id !== id); store.set("hub-mine", mine); }
      else { hidden = [...hidden, id]; store.set("hub-hidden", hidden); }
      favs = favs.filter((x) => x !== id); store.set("hub-favs", favs);
      return render();
    }
    if (e.target.closest("#addBtn")) { e.preventDefault(); return $("#dlg").showModal(); }
    if (e.target.closest("#restore")) { hidden = []; store.set("hub-hidden", hidden); return render(); }
    if (editing && e.target.closest(".tile")) e.preventDefault();
  });

  $("#addForm").addEventListener("close", () => {});
  $("#dlg").addEventListener("close", () => {
    if ($("#dlg").returnValue !== "ok") return;
    let url = $("#fUrl").value.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    mine = [...mine, { id: "m" + Date.now().toString(36), en: $("#fName").value.trim(), ar: $("#fName").value.trim(), url, icon: $("#fIcon").value.trim() || "⭐", color: "#475569" }];
    store.set("hub-mine", mine);
    $("#addForm").reset();
    render();
    ping();
  });

  $("#q").addEventListener("input", render);
  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
    if (e.key === "Escape") { $("#q").value = ""; render(); }
    if (e.key === "Enter" && document.activeElement === $("#q")) { const first = document.querySelector("#main .tile[href]"); if (first) first.click(); }
  });
  $("#lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; store.set("hub-lang", lang); render(); };
  $("#edit").onclick = () => { editing = !editing; render(); if (editing) toast(lang === "ar" ? "اضغط × للإخفاء، ★ للمفضلة" : "Tap × to hide, ★ to favourite"); };
  const setTheme = (t) => { document.documentElement.dataset.theme = t; $("#theme").textContent = t === "dark" ? "☀" : "☾"; };
  setTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");
  $("#theme").onclick = () => { const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark"; setTheme(t); store.set("hub-theme", t); try { localStorage.setItem("hub-theme", t); } catch {} };

  // Reachability: an opaque no-cors response means the site answered; a network error or timeout means it did not.
  async function ping() {
    if (!navigator.onLine) return;
    await Promise.all(all().map(async (a) => {
      try {
        const c = new AbortController();
        const t = setTimeout(() => c.abort(), 7000);
        await fetch(a.url, { mode: "no-cors", cache: "no-store", signal: c.signal });
        clearTimeout(t);
        status[a.url] = "up";
      } catch { status[a.url] = "down"; }
    }));
    render();
  }

  // Install (Chrome/Edge/Android); iOS shows instructions
  let deferred = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("#install").style.display = "inline-flex"; });
  window.addEventListener("appinstalled", () => { $("#install").style.display = "none"; toast(lang === "ar" ? "تم التثبيت" : "Installed"); });
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (ios && !standalone) $("#install").style.display = "inline-flex";
  $("#install").onclick = async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $("#install").style.display = "none"; }
    else if (ios) toast(lang === "ar" ? "في Safari: زر المشاركة ⬆ ثم «إضافة إلى الشاشة الرئيسية»" : "In Safari: Share ⬆ then “Add to Home Screen”");
  };

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  window.addEventListener("online", ping);
  render();
  ping();
})();
</script>
</body>
</html>
